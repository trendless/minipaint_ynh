#:schema https://raw.githubusercontent.com/YunoHost/apps/master/schemas/manifest.v2.schema.json

packaging_format = 2

id = "minipaint"
name = "miniPaint"
description.en = "web-based image editor"
description.fr = ""

version = "4.14.3~ynh1"

maintainers = ["trendless"]

[upstream]
license = "MIT"
demo = "http://viliusle.github.io/miniPaint"
admindoc = "https://github.com/viliusle/miniPaint/wiki"
code = "https://github.com/viliusle/miniPaint"

[integration]
yunohost = ">= 12.1.39"
helpers_version = "2.1"
architectures = "all"
multi_instance = true

ldap = false
sso = false

disk = "50M"
ram.build = "50M"
ram.runtime = "50M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

[resources]
    [resources.sources.main]
    url = "https://github.com/viliusle/miniPaint/archive/refs/tags/v4.14.3.tar.gz"
    sha256 = "549e726d3dd3d9f1c4b20825631de5300ab545acbb4e23fd30bd4c443f64e83f"
    autoupdate.strategy = "latest_github_release"

    [resources.system_user]

    [resources.install_dir]

    [resources.permissions]
    main.url = "/"

    [resources.nodejs]
    version = "24"
